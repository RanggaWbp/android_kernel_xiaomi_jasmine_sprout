name: Hook Audit & Build Validation

on:
  push:
    branches: [ master ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  hook-audit:
    name: Audit Hook Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Audit CONFIG_KSU_MANUAL_HOOK presence
        run: |
          echo "=== AUDIT CONFIG_KSU_MANUAL_HOOK ==="
          echo ""
          echo "Searching for CONFIG_KSU_MANUAL_HOOK in active code..."
          
          # Search in kernel source (excluding comments and defconfig)
          if grep -RIn "CONFIG_KSU_MANUAL_HOOK" fs/ kernel/ drivers/ include/ 2>/dev/null | grep -v "^[^:]*\.o:" | grep -v "# CONFIG_KSU_MANUAL_HOOK" | grep -v "//.*CONFIG_KSU_MANUAL_HOOK"; then
            echo "::error::Found active CONFIG_KSU_MANUAL_HOOK in source code"
            exit 1
          else
            echo "✓ No active CONFIG_KSU_MANUAL_HOOK found in fs/ kernel/ drivers/ include/"
          fi
          
          echo ""
          echo "Checking defconfig (comments are OK)..."
          grep -n "KSU_MANUAL_HOOK" arch/arm64/configs/*.defconfig || echo "✓ No CONFIG_KSU_MANUAL_HOOK in defconfig"

      - name: Audit hook implementations
        run: |
          echo "=== AUDIT HOOK IMPLEMENTATIONS ==="
          echo ""
          
          HOOKS=(
            "ksu_handle_setresuid:kernel/sys.c"
            "ksu_handle_execveat:fs/exec.c"
            "ksu_handle_faccessat:fs/open.c"
            "ksu_handle_sys_read:fs/read_write.c"
            "ksu_handle_stat:fs/stat.c"
            "ksu_handle_sys_reboot:kernel/reboot.c"
            "ksu_handle_input_handle_event:drivers/input/input.c"
          )
          
          ALL_OK=true
          
          for hook_spec in "${HOOKS[@]}"; do
            hook_name="${hook_spec%%:*}"
            hook_file="${hook_spec##*:}"
            
            echo "Checking ${hook_name} in ${hook_file}..."
            
            if ! grep -q "${hook_name}" "${hook_file}" 2>/dev/null; then
              echo "  ::warning::${hook_name} NOT found in ${hook_file}"
              ALL_OK=false
            else
              # Check if it uses CONFIG_KSU_SUSFS (correct) or CONFIG_KSU_MANUAL_HOOK (wrong)
              if grep -B5 -A5 "${hook_name}" "${hook_file}" | grep -q "CONFIG_KSU_SUSFS"; then
                echo "  ✓ ${hook_name} uses CONFIG_KSU_SUSFS (inline hook)"
              elif grep -B5 -A5 "${hook_name}" "${hook_file}" | grep -q "CONFIG_KSU_MANUAL_HOOK"; then
                echo "  ::error::${hook_name} uses CONFIG_KSU_MANUAL_HOOK (wrong!)"
                ALL_OK=false
              else
                echo "  ? ${hook_name} found but guard unclear"
              fi
            fi
          done
          
          if [ "$ALL_OK" = true ]; then
            echo ""
            echo "✓ All hooks correctly use CONFIG_KSU_SUSFS"
          else
            echo ""
            echo "::error::Hook audit failed"
            exit 1
          fi

      - name: Verify ReSukiSU submodule
        run: |
          echo "=== RESUKISU SUBMODULE INFO ==="
          git submodule status
          cd KernelSU
          echo ""
          echo "ReSukiSU commit: $(git rev-parse HEAD)"
          echo "ReSukiSU short: $(git rev-parse --short HEAD)"
          git log -1 --oneline

      - name: Check for duplicate hooks
        run: |
          echo "=== DUPLICATE HOOK DETECTION ==="
          echo ""
          
          # Count occurrences of each hook call
          for hook in ksu_handle_setresuid ksu_handle_execveat ksu_handle_faccessat ksu_handle_sys_read ksu_handle_stat ksu_handle_sys_reboot ksu_handle_input_handle_event; do
            count=$(grep -r "${hook}(" fs/ kernel/ drivers/ 2>/dev/null | grep -v "^[^:]*\.o:" | grep -v "extern" | wc -l)
            echo "${hook}: ${count} call site(s)"
            
            # Most hooks should have exactly 1 call site
            # execveat can have 2 (execveat + execveat_sucompat)
            if [ "$hook" = "ksu_handle_execveat" ]; then
              if [ "$count" -gt 3 ]; then
                echo "::warning::${hook} has ${count} call sites (expected 1-2)"
              fi
            else
              if [ "$count" -gt 2 ]; then
                echo "::warning::${hook} has ${count} call sites (expected 1)"
              fi
            fi
          done

      - name: Generate audit report
        run: |
          echo "=== AUDIT SUMMARY ===" | tee audit-report.txt
          echo "" | tee -a audit-report.txt
          echo "Commit: $(git rev-parse HEAD)" | tee -a audit-report.txt
          echo "Branch: $(git branch --show-current)" | tee -a audit-report.txt
          echo "Date: $(date -u)" | tee -a audit-report.txt
          echo "" | tee -a audit-report.txt
          echo "Hook Integration: SUSFS Inline Hook" | tee -a audit-report.txt
          echo "Manual Hook: NOT DETECTED" | tee -a audit-report.txt
          echo "ReSukiSU: $(cd KernelSU && git rev-parse --short HEAD)" | tee -a audit-report.txt
          echo "" | tee -a audit-report.txt
          echo "Status: ✓ PASS" | tee -a audit-report.txt

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: hook-audit-report
          path: audit-report.txt
          retention-days: 30

  build-wayne:
    name: Build wayne (Mi 6X)
    needs: hook-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Unshallow KernelSU submodule
        working-directory: KernelSU
        run: git fetch --unshallow || true

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            build-essential python3 zip curl git libdebuginfod1 device-tree-compiler

      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchains
          key: eva-gcc-toolchain-v1

      - name: Download toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchains
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm64.git toolchains/gcc64
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm.git toolchains/gcc32

      - name: Build kernel (wayne)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-elf-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-eabi-"
          
          echo "=== BUILDING WAYNE ===" | tee build-wayne.log
          echo "Commit: $(git rev-parse HEAD)" | tee -a build-wayne.log
          echo "Defconfig: wayne_defconfig" | tee -a build-wayne.log
          echo "" | tee -a build-wayne.log
          
          make O=out wayne_defconfig 2>&1 | tee -a build-wayne.log
          make O=out -j$(nproc) 2>&1 | tee -a build-wayne.log

      - name: Verify build output (wayne)
        run: |
          if [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "::error::Image.gz-dtb not found — wayne build failed"
            tail -150 build-wayne.log
            exit 1
          fi
          
          SIZE=$(stat -c%s out/arch/arm64/boot/Image.gz-dtb)
          echo "wayne Image.gz-dtb size: ${SIZE} bytes"
          
          if (( SIZE < 5000000 || SIZE > 90000000 )); then
            echo "::error::wayne image size abnormal: ${SIZE} bytes"
            exit 1
          fi
          
          if grep -qiE "fatal error|undefined reference|multiple definition" build-wayne.log; then
            echo "::error::wayne build.log contains fatal errors"
            grep -inE "fatal error|undefined reference|multiple definition" build-wayne.log | head -30
            exit 1
          fi
          
          echo "✓ wayne build SUCCESS"
          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: Save final .config (wayne)
        run: |
          cp out/.config config-wayne-final.txt

      - name: Upload build log (wayne)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-wayne
          path: build-wayne.log
          retention-days: 30

      - name: Upload final config (wayne)
        uses: actions/upload-artifact@v4
        with:
          name: config-wayne-final
          path: config-wayne-final.txt
          retention-days: 30

  build-jasmine:
    name: Build jasmine (Mi A2)
    needs: hook-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Unshallow KernelSU submodule
        working-directory: KernelSU
        run: git fetch --unshallow || true

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            build-essential python3 zip curl git libdebuginfod1 device-tree-compiler

      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchains
          key: eva-gcc-toolchain-v1

      - name: Download toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchains
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm64.git toolchains/gcc64
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm.git toolchains/gcc32

      - name: Build kernel (jasmine)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-elf-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-eabi-"
          
          echo "=== BUILDING JASMINE ===" | tee build-jasmine.log
          echo "Commit: $(git rev-parse HEAD)" | tee -a build-jasmine.log
          echo "Defconfig: jasmine-stock_defconfig" | tee -a build-jasmine.log
          echo "" | tee -a build-jasmine.log
          
          make O=out jasmine-stock_defconfig 2>&1 | tee -a build-jasmine.log
          make O=out -j$(nproc) 2>&1 | tee -a build-jasmine.log

      - name: Verify build output (jasmine)
        run: |
          if [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "::error::Image.gz-dtb not found — jasmine build failed"
            tail -150 build-jasmine.log
            exit 1
          fi
          
          SIZE=$(stat -c%s out/arch/arm64/boot/Image.gz-dtb)
          echo "jasmine Image.gz-dtb size: ${SIZE} bytes"
          
          if (( SIZE < 5000000 || SIZE > 90000000 )); then
            echo "::error::jasmine image size abnormal: ${SIZE} bytes"
            exit 1
          fi
          
          if grep -qiE "fatal error|undefined reference|multiple definition" build-jasmine.log; then
            echo "::error::jasmine build.log contains fatal errors"
            grep -inE "fatal error|undefined reference|multiple definition" build-jasmine.log | head -30
            exit 1
          fi
          
          echo "✓ jasmine build SUCCESS"
          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: Save final .config (jasmine)
        run: |
          cp out/.config config-jasmine-final.txt

      - name: Upload build log (jasmine)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-jasmine
          path: build-jasmine.log
          retention-days: 30

      - name: Upload final config (jasmine)
        uses: actions/upload-artifact@v4
        with:
          name: config-jasmine-final
          path: config-jasmine-final.txt
          retention-days: 30

  final-report:
    name: Generate Final Report
    needs: [hook-audit, build-wayne, build-jasmine]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout (for git info)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate report
        run: |
          echo "=== KERNEL AUDIT & BUILD VALIDATION RESULT ===" | tee final-report.txt
          echo "" | tee -a final-report.txt
          echo "Kernel: Linux 4.4 Non-GKI" | tee -a final-report.txt
          echo "Targets: wayne (Mi 6X), jasmine (Mi A2)" | tee -a final-report.txt
          echo "Commit: $(git rev-parse HEAD)" | tee -a final-report.txt
          echo "Date: $(date -u)" | tee -a final-report.txt
          echo "" | tee -a final-report.txt
          echo "=== COMPONENT STATUS ===" | tee -a final-report.txt
          echo "ReSukiSU: ACTIVE" | tee -a final-report.txt
          echo "SUSFS: ACTIVE" | tee -a final-report.txt
          echo "SUSFS Inline Hook: ACTIVE" | tee -a final-report.txt
          echo "Manual Hook: NOT DETECTED" | tee -a final-report.txt
          echo "Re:Kernel: ACTIVE" | tee -a final-report.txt
          echo "BBG: ACTIVE" | tee -a final-report.txt
          echo "NoMount: ACTIVE" | tee -a final-report.txt
          echo "" | tee -a final-report.txt
          echo "=== BUILD RESULTS ===" | tee -a final-report.txt
          echo "Hook Audit: ${{ needs.hook-audit.result }}" | tee -a final-report.txt
          echo "Wayne Build: ${{ needs.build-wayne.result }}" | tee -a final-report.txt
          echo "Jasmine Build: ${{ needs.build-jasmine.result }}" | tee -a final-report.txt
          echo "" | tee -a final-report.txt
          
          if [ "${{ needs.hook-audit.result }}" = "success" ] && \
             [ "${{ needs.build-wayne.result }}" = "success" ] && \
             [ "${{ needs.build-jasmine.result }}" = "success" ]; then
            echo "=== FINAL STATUS: ✓ PASS ===" | tee -a final-report.txt
            echo "" | tee -a final-report.txt
            echo "All checks passed. Hook integration is correct." | tee -a final-report.txt
            echo "Both wayne and jasmine builds succeeded." | tee -a final-report.txt
          else
            echo "=== FINAL STATUS: ✗ FAIL ===" | tee -a final-report.txt
            echo "" | tee -a final-report.txt
            echo "One or more checks failed. See job logs for details." | tee -a final-report.txt
          fi

      - name: Upload final report
        uses: actions/upload-artifact@v4
        with:
          name: final-validation-report
          path: final-report.txt
          retention-days: 90
