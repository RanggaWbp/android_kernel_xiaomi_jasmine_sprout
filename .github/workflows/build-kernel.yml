name: Build & Release Mi A2 Kernel (jasmine_sprout)

on:
  push:
    branches: [ main ]
    paths:
      - "arch/arm64/configs/jasmine_sprout_defconfig"
      - "arch/arm/boot/dts/**"
      - "fs/**"
      - "kernel/**"
      - "drivers/**"
      - "security/**"
      - "mm/**"
      - "ipc/**"
      - "net/**"
      - "include/**"
      - "sound/**"
      - "Makefile"
      - "Kbuild"
      - "KernelSU"
      - ".github/workflows/*.yml"
      - ".github/scripts/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build jasmine_sprout (Mi A2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Report repository state
        run: |
          {
            echo "=== REPOSITORY STATE ==="
            echo "commit : $(git rev-parse HEAD)"
            echo "date   : $(date -u)"
            echo
            echo "=== SUBMODULE STATUS ==="
            git submodule status
            echo
            echo "=== RESUKISU VERSION ==="
            echo "commit  : $(git -C KernelSU rev-parse HEAD)"
            echo "subject : $(git -C KernelSU log -1 --format='%s')"
          } | tee git-state.log

      - name: Verify submodule resolves (drivers/kernelsu symlink)
        run: |
          echo "drivers/kernelsu -> $(readlink drivers/kernelsu)"
          [ -f KernelSU/kernel/Kbuild ] || { echo "::error::KernelSU/kernel/Kbuild missing"; exit 1; }
          [ -f drivers/kernelsu/Kbuild ] || { echo "::error::drivers/kernelsu symlink broken"; exit 1; }

      - name: Run hook audit
        run: bash .github/scripts/audit_hooks.sh "$GITHUB_WORKSPACE"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            build-essential python3 zip curl git libdebuginfod1 device-tree-compiler

      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchains
          key: eva-gcc-toolchain-jasmine-v1

      - name: Download toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchains
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm64.git toolchains/gcc64
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm.git toolchains/gcc32

      - name: Configure (jasmine_sprout_defconfig)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-elf-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-eabi-"
          make O=out jasmine_sprout_defconfig 2>&1 | tee defconfig.log

      - name: Validate resolved .config
        run: |
          rc=0
          for opt in CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_NOMOUNT CONFIG_BBG CONFIG_REKERNEL CONFIG_KEYS; do
            grep -qE "^${opt}=y" out/.config || { echo "::error::${opt} is not =y in resolved .config"; rc=1; }
          done
          grep -qE "^CONFIG_KSU_MANUAL_HOOK=y" out/.config \
            && { echo "::error::CONFIG_KSU_MANUAL_HOOK=y present"; rc=1; }
          grep -qE "^CONFIG_MACH_XIAOMI_WAYNE=y" out/.config \
            || { echo "::error::CONFIG_MACH_XIAOMI_WAYNE=y dropped -- jasmine DTB will not be built"; rc=1; }
          grep -qE '^CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES="sdm660-mtp-jasmine"' out/.config \
            || { echo "::error::APPENDED_DTB_IMAGE_NAMES not pinned to sdm660-mtp-jasmine"; rc=1; }
          [ "$rc" -eq 0 ] && echo "resolved config OK"
          exit "$rc"

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-elf-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-eabi-"
          set -o pipefail
          make O=out -j"$(nproc)" 2>&1 | tee build.log

      - name: Verify build output
        run: |
          IMG="out/arch/arm64/boot/Image.gz-dtb"
          [ -f "$IMG" ] || { echo "::error::$IMG not found"; tail -150 build.log; exit 1; }
          SIZE=$(stat -c%s "$IMG")
          echo "Image.gz-dtb size: ${SIZE} bytes"
          if (( SIZE < 5000000 || SIZE > 90000000 )); then
            echo "::error::abnormal Image.gz-dtb size (${SIZE} bytes)"
            exit 1
          fi
          if grep -qiE "fatal error|undefined reference|multiple definition" build.log; then
            echo "::error::build.log contains fatal errors"
            grep -inE "fatal error|undefined reference|multiple definition" build.log | head -30
            exit 1
          fi
          echo "Build output OK."

      - name: Verify appended DTB matches this device
        run: |
          IMG="out/arch/arm64/boot/Image.gz-dtb"
          python3 .github/scripts/verify_appended_dtb.py "$IMG" \
            --expect-board-id "196616 0" \
            --expect-dtb "sdm660-mtp-jasmine.dtb"

      - name: Confirm hook symbols in build artifacts
        run: |
          for sym in ksu_handle_setresuid ksu_handle_execveat ksu_handle_faccessat \
                     ksu_handle_sys_read ksu_handle_stat ksu_handle_sys_reboot \
                     ksu_handle_input_handle_event; do
            printf '  %-32s ' "$sym"
            grep -qw "$sym" out/System.map 2>/dev/null && echo present || echo ABSENT
          done

      - name: Package AnyKernel3 zip
        run: |
          BUILD_DATE="$(date -u +'%d-%m-%Y')"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          cd AK3
          rm -rf ramdisk patch tools/keycheck
          cp ../out/arch/arm64/boot/Image.gz-dtb .
          cat > anykernel.sh << EOF
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=Mi A2 Kernel (jasmine_sprout) | features: ReSukiSU + SUSFS + Re:Kernel + NoMount + BBG | by RanggaWbp | ${BUILD_DATE}
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=jasmine_sprout
          device.name2=jasmine
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }
          boot_attributes() {
          set_perm_recursive 0 0 755 644 \$RAMDISK/*;
          set_perm_recursive 0 0 750 750 \$RAMDISK/init* \$RAMDISK/sbin;
          }
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          EOF
          SHORT_SHA="$(cd .. && git rev-parse --short HEAD)"
          ZIP_NAME="jasmine_sprout-ReSukiSU-SUSFS-${SHORT_SHA}-${BUILD_DATE}.zip"
          zip -r9 "../${ZIP_NAME}" . -x ".git/*" ".github/*" "*.md"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Upload zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: zip-jasmine_sprout
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            defconfig.log
            git-state.log
          retention-days: 7

  release:
    name: Publish release
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Compute release tag
        run: |
          echo "BUILD_DATE=$(date -u +'%d-%m-%Y')" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=jasmine-kernel-$(date -u +'%Y%m%d')-${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Download zip artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: zip-*
          merge-multiple: true
          path: zips

      - name: Verify expected zip is present
        run: |
          COUNT=$(ls -1 zips/*.zip 2>/dev/null | wc -l)
          echo "collected ${COUNT} zip(s)"
          [ "$COUNT" -eq 1 ] || { echo "::error::expected 1 zip, got ${COUNT}"; exit 1; }
          ls zips/jasmine_sprout-*.zip >/dev/null 2>&1 || { echo "::error::jasmine zip missing"; exit 1; }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Mi A2 Kernel ${{ env.BUILD_DATE }} (run #${{ github.run_number }})"
          prerelease: true
          fail_on_unmatched_files: true
          files: zips/*.zip
          body: |
            # Mi A2 Kernel — jasmine_sprout

            Linux 4.4 (Non-GKI) · ARM64 · commit [`${{ github.sha }}`](https://github.com/RanggaWbp/android_kernel_xiaomi_jasmine_sprout/commit/${{ github.sha }})

            ## Features

            | Feature | Description |
            | :------ | :---------- |
            | **ReSukiSU** | Kernel-based root solution |
            | **SUSFS** | Root-hiding filesystem layer |
            | **Re:Kernel** | Kernel-level hardening |
            | **NoMount** | Mount namespace isolation |
            | **BBG** | Baseband guard, anti-format |

            ## Flash

            Flash the zip in TWRP. AnyKernel3 — no need to extract.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
